# Installed automatically by `npm ci` (lefthook's postinstall). Needs `brew install gitleaks`.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner
    typecheck:
      run: npm run typecheck
    eslint:
      glob: '*.{ts,tsx,mjs}'
      run: npx eslint --no-warn-ignored {staged_files}
    drizzle:
      glob: '{drizzle/**,src/main/modules/*/*.entity.ts,src/main/platform/db/**,drizzle.config.ts}'
      run: npm run db:check
    ipc:
      glob: '{src/shared/ipc.ts,src/preload/index.ts,src/main/modules/*/*.controller.ts,src/main/app/main.ts,ipc-manifest.json}'
      run: npm run ipc:check

commit-msg:
  commands:
    # agy appends an Antigravity co-author trailer that GitHub credits to an unrelated account.
    strip-antigravity-coauthor:
      run: node -e "const fs=require('fs');const f=process.argv[1];fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/^co-authored-by:.*antigravity@google\\.com.*\\n?/gim,''))" {1}
