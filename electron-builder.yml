appId: app.jobpilot.desktop
productName: JobPilot
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: drizzle
    to: drizzle
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3*/**'
  - '**/*.node'
afterPack: scripts/after-pack.mjs
mac:
  category: public.app-category.productivity
  target: [dmg]
  identity: null # ad-hoc signed; no paid certificate (see docs/RELEASE.md)
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Office
publish: null
