appId: app.jobpilot.desktop
productName: JobPilot
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**'
extraResources:
  - from: drizzle
    to: drizzle
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/*.node'
beforePack: scripts/before-pack.mjs
afterPack: scripts/after-pack.mjs
mac:
  category: public.app-category.productivity
  target: [dmg]
  # electron-builder ad-hoc signs; scripts/sign-app.mjs is the single signer for CI/release.
  identity: null
win:
  target: [nsis]
nsis:
  artifactName: JobPilot-${version}-x64-setup.${ext}
linux:
  target: [AppImage, deb]
  category: Office
  maintainer: sadowb <sadowb@users.noreply.github.com>
  vendor: sadowb <sadowb@users.noreply.github.com>
  artifactName: JobPilot-${version}-x64.${ext}
deb:
  artifactName: JobPilot-${version}-amd64.${ext}
  # Replaces electron-builder's default list, so it repeats it in full and adds ALSA (Electron needs it).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - 'libasound2t64 | libasound2'
publish: null
