name: release
# One workflow on purpose: tags and releases created with GITHUB_TOKEN cannot trigger other workflows,
# and we use no PAT or GitHub App. release-please opens/updates the "Release vX.Y.Z" PR on every push to main;
# merging that PR makes it create a draft release + tag, and the jobs below build, attest and publish it.
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  static:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # release jobs never restore a shared cache
      - run: npm ci
      - run: node -e "if (process.env.TAG_VERSION.replace(/^v/, '') !== require('./package.json').version) process.exit(1)"
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run agents:probe
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high
      - run: npm run db:check
      - name: Verify IPC manifest
        run: npm run ipc:check
      - name: Run Semgrep with JobPilot rules
        run: pipx run semgrep==1.182.1 scan --config .semgrep/ --error --metrics=off
      - name: Run Electronegativity (Electron misconfigurations)
        run: |
          npx --yes @doyensec/electronegativity@1.10.3 -i src --parser-plugins typescript,jsx -o "$RUNNER_TEMP/electronegativity.sarif" || true
          node scripts/check-electronegativity.mjs "$RUNNER_TEMP/electronegativity.sarif"
      - name: Run OSV-Scanner on package-lock.json (fail on high)
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile package-lock.json --format json > "$RUNNER_TEMP/osv-results.json" || true
          node scripts/check-osv.mjs "$RUNNER_TEMP/osv-results.json"

  package-mac:
    environment: release
    needs: [release-please, static]
    permissions:
      contents: read # SBOM download only; assets are uploaded by the publish job
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Require release signing secrets
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "Release signing secrets are missing. Configure MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD on the 'release' environment (see ADR 0014)." >&2
            exit 1
          fi
      - name: Import release signing identity into temporary keychain
        timeout-minutes: 2
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          certdir="$RUNNER_TEMP/jobpilot-release-cert"
          keychain="$RUNNER_TEMP/jobpilot-release.keychain-db"
          mkdir -m 700 "$certdir"
          echo "$MAC_CERT_P12_BASE64" | base64 -D > "$certdir/release.p12"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certdir/release.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -in "$certdir/release.p12" -clcerts -nokeys -passin "pass:$MAC_CERT_PASSWORD" -out "$certdir/release.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$certdir/release.crt"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')
          if [ -z "$identity" ]; then security find-identity -v -p codesigning "$keychain"; exit 1; fi
          echo "JOBPILOT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # release has contents: write; never restore a shared cache
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:native
      - name: Package and sign release app
        run: |
          npx electron-builder --dir --mac --arm64
          node scripts/sign-app.mjs release/mac-arm64/JobPilot.app "$JOBPILOT_SIGN_IDENTITY"
      - name: Package previous commit for upgrade journey
        run: |
          BASE_SHA=$(git rev-parse HEAD^)
          git worktree add --detach "$RUNNER_TEMP/jobpilot-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/jobpilot-base"
          npm ci
          npm run build
          npx electron-builder --dir --mac --arm64
          node "$GITHUB_WORKSPACE/scripts/sign-app.mjs" "$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app" "$JOBPILOT_SIGN_IDENTITY"
          echo "JOBPILOT_BASE_EXECUTABLE=$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app/Contents/MacOS/JobPilot" >> "$GITHUB_ENV"
      - run: node scripts/run-e2e.mjs
      - name: Verify exact shipped bytes (fuses, signature, real boot)
        # Fresh default keychain = first install. The journeys' re-signed copy already owns the login-keychain item,
        # and an ad-hoc signature differs per binary, so the shipped app would block on a Keychain prompt (ADR 0014).
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security set-keychain-settings "$RUNNER_TEMP/shipped.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/shipped.keychain"
          security default-keychain -s "$RUNNER_TEMP/shipped.keychain"
          node scripts/verify-shipped.mjs
      - name: Build arm64 DMG from the tested .app
        run: npx electron-builder --mac dmg --arm64 --prepackaged release/mac-arm64/JobPilot.app
      - name: Download SPDX dependency SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" --jq '.sbom' > release/jobpilot.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/jobpilot.spdx.json
          if-no-files-found: error
      - name: Delete release signing identity
        if: always()
        # Trust records disappear with the ephemeral runner.
        continue-on-error: true
        run: |
          security delete-keychain "$RUNNER_TEMP/jobpilot-release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/jobpilot-release-cert"

  package-win:
    needs: [release-please, static]
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned by design; no secrets in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:native
      - run: npx electron-builder --win nsis --x64
      - name: Boot-test Windows installer
        run: node scripts/smoke-windows-installer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-win
          path: release/*-x64-setup.exe
          if-no-files-found: error

  package-linux:
    needs: [release-please, static]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # release jobs never restore a shared cache
      - name: Install Linux keyring and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0 libsecret-tools xvfb
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:native
      - name: Package Linux AppImage
        run: npx electron-builder --linux AppImage --x64
      - name: Boot packaged Linux AppImage
        run: |
          # Chromium's sandbox needs unprivileged user namespaces; Ubuntu 24.04 runners restrict them via AppArmor.
          # Allow them (the kernel default on most distros) so the AppImage boots exactly as shipped, sandbox on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a dbus-run-session -- bash -c '
            mkdir -p ~/.local/share/keyrings
            echo "ci" | gnome-keyring-daemon --daemonize --unlock --components=secrets
            export XDG_CURRENT_DESKTOP=GNOME
            node scripts/smoke-app.mjs release/*.AppImage --appimage-extract-and-run --password-store=gnome-libsecret
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: release/*.AppImage
          if-no-files-found: error

  publish:
    needs: [release-please, package-mac, package-win, package-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload to the draft and publish it
      id-token: write # Sigstore signing for attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksum every asset
        working-directory: dist
        run: sha256sum -- *.dmg *-x64-setup.exe *.AppImage jobpilot.spdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*-x64-setup.exe
            dist/*.AppImage
            dist/jobpilot.spdx.json
            dist/SHA256SUMS
      - name: Upload assets to the draft, then publish
        # Draft-first: immutable releases reject asset changes after publishing.
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]
          gh release upload "$TAG" dist/*.dmg dist/*-x64-setup.exe dist/*.AppImage dist/jobpilot.spdx.json dist/SHA256SUMS
          gh release edit "$TAG" --draft=false
