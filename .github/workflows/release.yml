name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pull-requests: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # release has contents: write; never restore a shared cache
      - run: npm ci
      - run: node -e "if (process.env.TAG_VERSION.replace(/^v/, '') !== require('./package.json').version) process.exit(1)"
        env:
          TAG_VERSION: ${{ github.ref_name }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high
      - run: npm run db:check

  package:
    needs: static
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # release has contents: write; never restore a shared cache
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:native
      - run: npx electron-builder --dir --mac --arm64
      - name: Package previous commit for upgrade journey
        run: |
          BASE_SHA=$(git rev-parse HEAD^)
          git worktree add --detach "$RUNNER_TEMP/jobpilot-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/jobpilot-base"
          npm ci
          npm run build
          npx electron-builder --dir --mac --arm64
          echo "JOBPILOT_BASE_EXECUTABLE=$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app/Contents/MacOS/JobPilot" >> "$GITHUB_ENV"
      - run: node scripts/run-e2e.mjs
      - name: Verify exact shipped bytes (fuses, signature, real boot)
        # Fresh default keychain = first install. The journeys' re-signed copy already owns the login-keychain item,
        # and an ad-hoc signature differs per binary, so the shipped app would block on a Keychain prompt (ADR 0014).
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security set-keychain-settings "$RUNNER_TEMP/shipped.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/shipped.keychain"
          security default-keychain -s "$RUNNER_TEMP/shipped.keychain"
          node scripts/verify-shipped.mjs
      - name: Build arm64 DMG from the tested .app and checksum
        run: |
          npx electron-builder --mac dmg --arm64 --prepackaged release/mac-arm64/JobPilot.app
          cd release
          shasum -a 256 *.dmg > "$GITHUB_WORKSPACE/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dmg-${{ github.ref_name }}
          path: |
            release/*.dmg
            SHA256SUMS
          if-no-files-found: error
      - name: Open draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --draft release/*.dmg SHA256SUMS --title "JobPilot ${{ github.ref_name }}" --notes "Draft release. Owner review and publish required."
