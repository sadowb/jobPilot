name: dependency review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: 'MIT, ISC, MPL-2.0, OFL-1.1, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0, Python-2.0, CC0-1.0, Unlicense'
          # Reviewed exceptions: Anthropic's SDK ships under its own license (read by the owner); pako is MIT AND Zlib (both permissive).
          allow-dependencies-licenses: 'pkg:npm/%40anthropic-ai/claude-agent-sdk, pkg:npm/%40anthropic-ai/claude-agent-sdk-darwin-arm64, pkg:npm/%40anthropic-ai/claude-agent-sdk-darwin-x64, pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-arm64, pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-arm64-musl, pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-x64, pkg:npm/%40anthropic-ai/claude-agent-sdk-linux-x64-musl, pkg:npm/%40anthropic-ai/claude-agent-sdk-win32-arm64, pkg:npm/%40anthropic-ai/claude-agent-sdk-win32-x64, pkg:npm/pako'
          comment-summary-in-pr: on-failure
