name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run agents:probe
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high
      - run: npm run db:check

  app:
    needs: static
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - name: Start macOS timer
        id: timer
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Create per-job code-signing identity
        timeout-minutes: 2
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/jobpilot-ci.keychain-db"
          certdir="$RUNNER_TEMP/jobpilot-ci-cert"
          mkdir -m 700 "$certdir"
          keychain_password=$(openssl rand -hex 32)
          p12_password=$(openssl rand -hex 32)
          cat > "$certdir/extensions.cnf" <<'EOF'
          basicConstraints=critical,CA:false
          keyUsage=critical,digitalSignature
          extendedKeyUsage=critical,codeSigning
          EOF
          openssl req -x509 -newkey rsa:3072 -sha256 -days 2 -nodes \
            -keyout "$certdir/jobpilot.key" -out "$certdir/jobpilot.crt" \
            -subj "/CN=JobPilot CI" -extensions v3_req \
            -config <(printf '[req]\ndistinguished_name=dn\nx509_extensions=v3_req\n[dn]\n[v3_req]\n%s' "$(cat "$certdir/extensions.cnf")")
          openssl pkcs12 -export -inkey "$certdir/jobpilot.key" -in "$certdir/jobpilot.crt" \
            -name "JobPilot CI" -out "$certdir/jobpilot.p12" -passout "pass:$p12_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$certdir/jobpilot.p12" -k "$keychain" -P "$p12_password" -T /usr/bin/codesign
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$certdir/jobpilot.crt"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"JobPilot CI"/ { print $2; exit }')
          if [ -z "$identity" ]; then security find-identity -v -p codesigning "$keychain"; exit 1; fi
          echo "JOBPILOT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "JOBPILOT_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:native
      - name: Package PR app
        run: |
          npx electron-builder --dir --mac --arm64
          node scripts/sign-app.mjs release/mac-arm64/JobPilot.app "$JOBPILOT_SIGN_IDENTITY"
      - name: Prepare PR base for upgrade journey
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/jobpilot-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/jobpilot-base"
          node -p "'electron=' + require('./package-lock.json').packages['node_modules/electron'].version" >> "$GITHUB_OUTPUT"
      - name: Restore unsigned PR base app
        id: base-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/jobpilot-base/release/mac-arm64/JobPilot.app
          key: pr-base-app-${{ github.event.pull_request.base.sha }}-${{ runner.os }}-arm64-electron-${{ steps.base.outputs.electron }}
      - name: Package PR base for upgrade journey
        if: github.event_name == 'pull_request' && steps.base-cache.outputs.cache-hit != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd "$RUNNER_TEMP/jobpilot-base"
          npm ci
          npm run build
          npx electron-builder --dir --mac --arm64
      - name: Cache unsigned PR base app before per-job signing
        if: github.event_name == 'pull_request' && steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/jobpilot-base/release/mac-arm64/JobPilot.app
          key: ${{ steps.base-cache.outputs.cache-primary-key }}
      - name: Sign PR base with per-job identity
        if: github.event_name == 'pull_request'
        run: |
          node scripts/sign-app.mjs "$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app" "$JOBPILOT_SIGN_IDENTITY"
          echo "JOBPILOT_BASE_EXECUTABLE=$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app/Contents/MacOS/JobPilot" >> "$GITHUB_ENV"
      - name: Assert PR and base designated requirements match
        if: github.event_name == 'pull_request'
        run: |
          pr_dr=$(codesign -dr - release/mac-arm64/JobPilot.app 2>&1 | sed -n 's/^.*designated => //p')
          base_dr=$(codesign -dr - "$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app" 2>&1 | sed -n 's/^.*designated => //p')
          printf 'PR DR:   %s\nBase DR: %s\n' "$pr_dr" "$base_dr"
          [[ "$pr_dr" == "$base_dr" && "$pr_dr" == *'certificate leaf = H"'* && "$pr_dr" != *cdhash* ]]
          pr_cdhash=$(codesign -dv --verbose=4 release/mac-arm64/JobPilot.app 2>&1 | sed -n 's/^CDHash=//p')
          base_cdhash=$(codesign -dv --verbose=4 "$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app" 2>&1 | sed -n 's/^CDHash=//p')
          pr_sha=$(shasum -a 256 release/mac-arm64/JobPilot.app/Contents/MacOS/JobPilot | awk '{ print $1 }')
          base_sha=$(shasum -a 256 "$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app/Contents/MacOS/JobPilot" | awk '{ print $1 }')
          printf 'PR CDHash: %s\nBase CDHash: %s\nPR executable SHA-256: %s\nBase executable SHA-256: %s\n' \
            "$pr_cdhash" "$base_cdhash" "$pr_sha" "$base_sha"
          [[ -n "$pr_cdhash" && -n "$base_cdhash" ]]
      - name: Run dev, packaged, and upgrade journeys
        run: node scripts/run-e2e.mjs
      - name: Verify exact shipped bytes (fuses, signature, real boot)
        # Fresh default keychain = first install. The journey apps share the CI certificate DR (ADR 0014).
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security set-keychain-settings "$RUNNER_TEMP/shipped.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/shipped.keychain"
          security default-keychain -s "$RUNNER_TEMP/shipped.keychain"
          node scripts/verify-shipped.mjs
      - name: Report macOS minutes
        if: always()
        env:
          STARTED: ${{ steps.timer.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          minutes=$(awk -v seconds="$elapsed" 'BEGIN { printf "%.2f", seconds / 60 }')
          echo "### macOS app job: ${minutes} minutes wall time" >> "$GITHUB_STEP_SUMMARY"
      # Screenshots are review evidence for every run, not only failures (PR template: Verification).
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload bulk add screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bulk-add-screenshots
          path: test-results/**/bulk-*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Delete per-job signing identity
        if: always()
        # Trust records disappear with the ephemeral runner.
        continue-on-error: true
        run: |
          security delete-keychain "$RUNNER_TEMP/jobpilot-ci.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/jobpilot-ci-cert"
