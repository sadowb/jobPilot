name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm audit --audit-level=high
      - run: npm run db:check

  app:
    needs: static
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - name: Start macOS timer
        id: timer
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:native
      - run: npx electron-builder --dir --mac --arm64
      - name: Package PR base for upgrade journey
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/jobpilot-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/jobpilot-base"
          npm ci
          npm run build
          npx electron-builder --dir --mac --arm64
          echo "JOBPILOT_BASE_EXECUTABLE=$RUNNER_TEMP/jobpilot-base/release/mac-arm64/JobPilot.app/Contents/MacOS/JobPilot" >> "$GITHUB_ENV"
      - name: Run dev, packaged, and upgrade journeys
        run: node scripts/run-e2e.mjs
      - name: Verify exact shipped bytes (fuses, signature, real boot)
        # Fresh default keychain = first install. The journeys' re-signed copy already owns the login-keychain item,
        # and an ad-hoc signature differs per binary, so the shipped app would block on a Keychain prompt (ADR 0014).
        run: |
          security create-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security set-keychain-settings "$RUNNER_TEMP/shipped.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/shipped.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/shipped.keychain"
          security default-keychain -s "$RUNNER_TEMP/shipped.keychain"
          node scripts/verify-shipped.mjs
      - name: Report macOS minutes
        if: always()
        env:
          STARTED: ${{ steps.timer.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          minutes=$(awk -v seconds="$elapsed" 'BEGIN { printf "%.2f", seconds / 60 }')
          echo "### macOS app job: ${minutes} minutes wall time" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
