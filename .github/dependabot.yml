# Keeps GitHub Actions and npm deps current so runtime deprecations (e.g. Node 20 on runners) arrive as PRs, not warnings.
# Weekly + grouped to limit macOS CI minutes (private repo on GitHub Free bills macOS at 10x).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ['*'] }
    commit-message: { prefix: ci }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    ignore:
      # typescript-eslint 8.72.0 supports TypeScript <6.1.0; remove when it supports TS 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message: { prefix: deps }
